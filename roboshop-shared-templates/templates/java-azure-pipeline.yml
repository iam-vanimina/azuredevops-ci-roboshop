parameters:
  - name: deploy
    displayName: Deploy
    type: boolean
    default: false
  - name: project
    displayName: Project
    type: string
  - name: component
    displayName: Component
    type: string
variables:
  PROJECT: ${{ parameters.project }}
  COMPONENT: ${{ parameters.component }}
  DOCKER_USERNAME: 'vanimina'
  #AWS_ACCOUNT_ID: '390663897550'
  #AWS_REGION: 'ap-south-1'
  #ECR_REGISTRY: '390663897550.dkr.ecr.ap-south-1.amazonaws.com'

  JAVA_VERSION: '21'


stages:

# ============================================================
# READ VERSION FROM pom.xml
# ============================================================

- stage: ReadVersion
  displayName: Read Version
  condition: ne(variables['Build.SourceBranch'], 'refs/heads/main')

  jobs:

    - job: ReadVersion
      displayName: Read Maven Project Version

      pool:
        name: 'AGENT-2'

      steps:

        - checkout: self

        - bash: |
            set -e

            echo "Reading application version from pom.xml..."

            VERSION=$(mvn help:evaluate \
              -Dexpression=project.version \
              -q \
              -DforceStdout)

            echo "Application Version: $VERSION"

            echo "##vso[task.setvariable variable=APP_VERSION;isOutput=true]$VERSION"

          name: getVersion
          displayName: Read pom.xml Version


# ============================================================
# BUILD / TEST
# ============================================================

- stage: Compile
  displayName: Compile and Test

  condition: ne(variables['Build.SourceBranch'], 'refs/heads/main')

  dependsOn:
    - ReadVersion

  jobs:

    - job: Compile

      displayName: Build Java Application

      pool:
        name: 'AGENT-2'

      steps:

        - checkout: self


        # ====================================================
        # JAVA 21
        # ====================================================

        - bash: |
            set -e

            echo "Checking Java installation..."

            java -version
            javac -version

            echo "JAVA_HOME=$JAVA_HOME"

          displayName: Verify Java 21


        # ====================================================
        # MAVEN VERSION
        # ====================================================

        - bash: |
            set -e

            mvn -version

          displayName: Verify Maven


        # ====================================================
        # BUILD
        # ====================================================

        - bash: |
            set -e

            echo "Building Java application..."

            mvn clean package -DskipTests

          displayName: Maven Build


        # ====================================================
        # UNIT TESTS
        # ====================================================

        - bash: |
            set -e

            echo "Running unit tests..."

            mvn test

          displayName: Maven Unit Tests


        # ====================================================
        # SONARQUBE
        # ====================================================

        # - task: SonarCloudPrepare@3
        #   displayName: Prepare SonarQube Cloud Analysis
        #   inputs:
        #     SonarCloud: 'sonarcloud-service-connection'
        #     organization: 'YOUR_SONAR_ORGANIZATION'
        #     scannerMode: 'Other'
        #     extraProperties: |
        #       sonar.projectKey=$(PROJECT)-$(COMPONENT)
        #       sonar.projectName=$(PROJECT)-$(COMPONENT)

        # - task: SonarCloudAnalyze@3
        #   displayName: SonarQube Cloud Analysis

        # - task: SonarCloudPublish@3
        #   displayName: Publish SonarQube Quality Gate
        #   inputs:
        #     pollingTimeoutSec: '300'


# ============================================================
# DOCKER BUILD + PUSH TO AWS ECR
# ============================================================

- stage: DockerBuild
  displayName: Docker Build and Push

  condition: ne(variables['Build.SourceBranch'], 'refs/heads/main')

  dependsOn:
    - ReadVersion
    - Compile

  variables:

    APP_VERSION: $[ stageDependencies.ReadVersion.ReadVersion.outputs['getVersion.APP_VERSION'] ]

  jobs:

    - job: DockerBuild

      displayName: Build Docker Image

      pool:
        name: 'AGENT-2'

      steps:

        - checkout: self


        # ====================================================
        # DISPLAY VERSION
        # ====================================================

        - bash: |
            set -e

            echo "======================================"
            echo "Project   : $(PROJECT)"
            echo "Component : $(COMPONENT)"
            echo "Version   : $(APP_VERSION)"
            #echo "Region    : $(AWS_REGION)"
            echo "======================================"

          displayName: Display Build Information


        # ====================================================
        # AWS ECR LOGIN
        # ====================================================

        - bash: |
            set -e

            echo "Logging into AWS ECR..."

            #aws ecr get-login-password --region $(AWS_REGION)| docker login --username AWS --password-stdin $(ECR_REGISTRY)
            
            #docker login -u "$(DOCKER_USERNAME)" -p "$(DOCKER_PASSWORD)"
            echo "$(DOCKER_PASSWORD)" | docker login -u "$(DOCKER_USERNAME)" --password-stdin

          #displayName: Login to AWS ECR
          displayName: Login to dockerhub registery 


        # ====================================================
        # DOCKER BUILD
        # ====================================================

        - bash: |
            set -e

            #IMAGE="$(ECR_REGISTRY)/$(PROJECT)/$(COMPONENT):$(APP_VERSION)"
             IMAGE="$(DOCKER_USERNAME)/$(COMPONENT):$(APP_VERSION)"
            echo "Building Docker image:"
            echo "$IMAGE"

            docker build \
              -t "$IMAGE" \
              .

          displayName: Docker Build


        # ====================================================
        # DOCKER PUSH
        # ====================================================

        - bash: |
            set -e

            #IMAGE="$(ECR_REGISTRY)/$(PROJECT)/$(COMPONENT):$(APP_VERSION)"
             IMAGE="$(DOCKER_USERNAME)/$(COMPONENT):$(APP_VERSION)"
            echo "Pushing Docker image:"
            echo "$IMAGE"
            
            echo "$(DOCKER_PASSWORD)" | docker login -u "$(DOCKER_USERNAME)" --password-stdin
            docker push "$IMAGE"

          displayName: Docker Push


# ============================================================
# DEPLOY
# ============================================================

- stage: Deploy

  displayName: Trigger Deployment

  dependsOn:
    - DockerBuild

  condition: >
    and(
      succeeded(),
      ne(variables['Build.SourceBranch'], 'refs/heads/main'),
      eq('${{ parameters.deploy }}', true)
    )

  variables:

    APP_VERSION: $[ stageDependencies.ReadVersion.ReadVersion.outputs['getVersion.VERSION'] ]

  jobs:

    - job: TriggerDeploy

      displayName: Trigger CD Pipeline

      pool:
        name: 'AGENT-2'

      steps:

        - bash: |

            echo "======================================"
            echo "Deployment enabled"
            echo "Project   : $(PROJECT)"
            echo "Component : $(COMPONENT)"
            echo "Version   : $(APP_VERSION)"
            echo "======================================"

            # Trigger Azure DevOps CD pipeline here.
            #
            # Example:
            #
            # az pipelines run \
            #   --name "$(COMPONENT)-cd" \
            #   --parameters \
            #       version="$(APP_VERSION)" \
            #       project="$(PROJECT)" \
            #       component="$(COMPONENT)"

          displayName: Trigger CD Pipeline


# ============================================================
# CLEANUP
# ============================================================

- stage: Cleanup

  displayName: Cleanup

  dependsOn:
    - ReadVersion
    - Compile
    - DockerBuild
    - Deploy

  condition: always()

  jobs:

    - job: Cleanup

      displayName: Cleanup Workspace

      pool:
        name: 'AGENT-2'

      steps:

        - bash: |

            echo "======================================"
            echo "Pipeline completed"
            echo "Cleaning workspace..."
            echo "======================================"

            git clean -fdx || true

          displayName: Cleanup
